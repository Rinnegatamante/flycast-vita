server = 

[perf]
Mvc2VideoTimingLog = yes
Mvc2NativeCache = no
Mvc2AotPack = no
# This file contains only guest SH4 coverage and remains valid after rebuilding
# Flycast. Prewarm emits fresh ARM code with the executable currently running.
Mvc2PortableCache = yes
Mvc2PortableWarmBudgetUs = 2000
Mvc2PortableInitialWarmBudgetUs = 4000000
# PAL fights submit about 50 renders per emulated second. Spend the prewarm
# budget only in boot/loading/transition intervals below that cadence.
Mvc2PortableWarmMaxRenders = 45
Mvc2NativeCacheRecord = no
Mvc2NativeCacheMerge = no
Mvc2PortableCacheRecord = yes
Mvc2NativeCacheValidate = no
# Portable v2 source collection is incremental and capped at 10 MiB. Atomic
# checkpoints are intentionally infrequent on Vita.
Mvc2NativeCacheSeconds = 120
FrameTrace = no
FrameTraceSeconds = 30
Mvc2CopyLoopHle = yes
Mvc2DirectFpuPairs = yes
Mvc2CacheLoopHle = yes
HlePatches = yes
JitBlockDump = no
RazorAutoCapture = no
RazorCaptureArmTimeout = 90
RazorCaptureDelay = 15
RazorCaptureLength = 0
RazorFrameSync = no

[validate]
OpenGlChecks = no
